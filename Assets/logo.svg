<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>MiCORE</title>
  <style>
    .ink { fill: #141414; }
    @media (prefers-color-scheme: dark) { .ink { fill: #F2F2F2; } }
  </style>
  <defs>
    <clipPath id="front"><rect x="-200" y="0" width="400" height="200"/></clipPath>
    <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g transform="translate(128 128)">
        <!-- anel orbital inteiro (a parte de trás some atrás do planeta) -->
        <ellipse rx="120" ry="42" transform="rotate(-20)" fill="none" stroke="#fff" stroke-width="11"/>
        <!-- planeta -->
        <circle r="68" fill="#fff"/>
        <!-- die do processador (o "core") -->
        <g transform="translate(0 -11)">
          <rect x="-29" y="-29" width="58" height="58" rx="9.8" fill="#000"/>
          <rect x="-21" y="-21" width="42" height="42" rx="5" fill="#fff"/>
          <g fill="#fff">
            <rect x="-14.75" y="-30" width="5.5" height="10"/><rect x="-2.75" y="-30" width="5.5" height="10"/><rect x="9.25" y="-30" width="5.5" height="10"/>
            <rect x="-14.75" y="20" width="5.5" height="10"/><rect x="-2.75" y="20" width="5.5" height="10"/><rect x="9.25" y="20" width="5.5" height="10"/>
            <rect x="-30" y="-14.75" width="10" height="5.5"/><rect x="-30" y="-2.75" width="10" height="5.5"/><rect x="-30" y="9.25" width="10" height="5.5"/>
            <rect x="20" y="-14.75" width="10" height="5.5"/><rect x="20" y="-2.75" width="10" height="5.5"/><rect x="20" y="9.25" width="10" height="5.5"/>
          </g>
        </g>
        <!-- metade da frente do anel, com folga separando do planeta -->
        <g transform="rotate(-20)" clip-path="url(#front)">
          <ellipse rx="120" ry="42" fill="none" stroke="#000" stroke-width="27"/>
          <ellipse rx="120" ry="42" fill="none" stroke="#fff" stroke-width="11"/>
        </g>
      </g>
    </mask>
  </defs>
  <rect class="ink" width="256" height="256" mask="url(#mark)"/>
</svg>
